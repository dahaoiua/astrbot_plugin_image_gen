name: astrbot_plugin_image_gen
display_name: 文生图
desc: 让 LLM 自己决定要不要配图：调可配置的出图接口（默认本机 ComfyUI），提示词中英混合、自带质量词
help: |
  /draw <描述>      手动生成一张图
  /draw_status      查看出图接口与显存状态
  平时不用敲命令：聊天时 LLM 会自己判断要不要配图，需要时先优化提示词（中英混合，中国元素保留中文）再调用 generate_image。
version: v1.0.0
author: dahaoiua
repo: https://github.com/dahaoiua/astrbot_plugin_image_gen
astrbot_version: ">=4.20.0"
